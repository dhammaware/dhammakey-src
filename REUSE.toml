#
# Bản quyền và giấy phép cho các tệp không ghi chú thích được (ảnh, biểu tượng, phông,
# tài liệu Markdown, JSON...). Tệp mã đã có tiêu đề SPDX riêng ở đầu tệp.
# Theo chuẩn REUSE 3.x: https://reuse.software/spec-3.3/
version = 1

[[annotations]]
path = [
  "**/*.md",
  "**/*.txt",
  "**/*.ico",
  "**/*.png",
  "**/*.svg",
  "**/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ujudhammo"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

# Phông chữ của bên thứ ba: giữ giấy phép gốc
[[annotations]]
path = ["tools/tray/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/myanmar)"
SPDX-License-Identifier = "OFL-1.1"

# Thư mục LICENSES/ và tệp LICENSE: chuẩn REUSE tự bỏ qua (là văn bản giấy phép).
