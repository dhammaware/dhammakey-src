# Tự động biên dịch + kiểm thử + đóng gói MSI mỗi lần đẩy mã lên GitHub
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: ./build/dk_tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Biên dịch x86 và x64
        run: |
          cmake -S . -B build-x86 -A Win32
          cmake --build build-x86 --config Release
          cmake -S . -B build-x64 -A x64
          cmake --build build-x64 --config Release
      - name: Kiểm thử lõi
        run: |
          build-x64\Release\dk_tests.exe
          build-x86\Release\dk_tests.exe
      - name: Đóng gói MSI
        working-directory: installer/windows
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build DhammaKey.wxs -arch x64 -d Arch=x64 -d BinX64=..\..\build-x64\platform\windows\Release -d BinX86=..\..\build-x86\platform\windows\Release -o DhammaKey-0.1.0-x64.msi
          wix build DhammaKey.wxs -arch x86 -d Arch=x86 -d BinX86=..\..\build-x86\platform\windows\Release -o DhammaKey-0.1.0-x86.msi
      - uses: actions/upload-artifact@v4
        with:
          name: DhammaKey-windows
          path: installer/windows/*.msi
